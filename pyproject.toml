[project]
name = "qb-forecast-rating"
version = "0.1.0"
description = "A reproducible, regression-based NFL quarterback rating designed to forecast future EPA per action."
readme = "README.md"
authors = [
    { name = "Jimmy Mullen" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "nflreadpy>=0.1.5",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.15.0",
]

[project.scripts]
qb-forecast-rating = "qb_forecast_rating.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qb_forecast_rating"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["nflreadpy", "nflreadpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true
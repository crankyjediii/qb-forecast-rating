repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: unsupported
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: unsupported
        pass_filenames: false